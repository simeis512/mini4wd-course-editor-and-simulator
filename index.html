<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミニ四駆コース作成シミュレーター</title>
    <style>
      :root {
        --bg: #1b1d22;
        --panel: #24272e;
        --line: #353943;
        --text: #e8e9ec;
        --muted: #9aa0ab;
        --accent: #3fd0ff;
        --warn: #ff9a2e;
        --ok: #39c26b;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 300px; grid-template-areas: 'bar bar' 'stage panel'; overflow: hidden; }
      #toolbar { grid-area: bar; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
      #toolbar h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
      #toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
      button, select { font: inherit; color: var(--text); background: #30343d; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; min-height: 34px; cursor: pointer; }
      button:hover:not(:disabled) { background: #3a3f4a; }
      button:disabled { opacity: 0.4; cursor: default; }
      button[aria-pressed='true'] { background: #1f5f75; border-color: var(--accent); }
      #stage { grid-area: stage; position: relative; min-height: 0; }
      #view2d, #view3d { position: absolute; inset: 0; width: 100%; height: 100%; }
      #view2d { touch-action: none; display: block; }
      #view3d canvas { display: block; touch-action: none; }
      #view3d .ar-button { position: absolute !important; bottom: 12px !important; }
      #fit { position: absolute; right: 10px; bottom: 10px; }
      #panel { grid-area: panel; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; }
      #panel h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; }
      #panel h2:first-child { margin-top: 0; }
      #palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      #palette button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; font-size: 12px; line-height: 1.3; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
      #palette button.dim { opacity: 0.55; }
      #palette .part-icon { width: 100%; max-width: 64px; aspect-ratio: 1; pointer-events: none; }
      body.dragging-part, body.dragging-part * { cursor: grabbing !important; }
      #palette small, .muted { color: var(--muted); }
      .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
      ul { margin: 4px 0; padding-left: 18px; }
      .pose-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
      .pose-grid label { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
      .pose-grid input { width: 100%; min-width: 0; font: inherit; color: var(--text); background: #30343d; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
      #context { position: absolute; z-index: 4; width: 290px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow-y: auto; padding: 10px 12px; background: rgba(36, 39, 46, 0.97); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px #0008; }
      #context button, #context select { min-height: 30px; padding: 3px 8px; }
      #context .row { gap: 4px; }
      #context .title { font-weight: 600; padding-right: 28px; }
      #context .close { position: absolute; top: 6px; right: 6px; min-height: 0; padding: 2px 8px; border: 0; background: transparent; font-size: 18px; line-height: 1; }
      #context details { margin-top: 8px; }
      #context summary, #course-info summary { cursor: pointer; color: var(--muted); font-size: 13px; }
      #course-info { position: absolute; left: 10px; bottom: 10px; z-index: 3; max-width: min(320px, calc(100% - 150px)); max-height: calc(100% - 20px); overflow-y: auto; padding: 6px 10px; background: rgba(36, 39, 46, 0.92); border: 1px solid var(--line); border-radius: 8px; }
      #course-info summary { color: var(--text); font-size: 14px; }
      #course-info[open] summary { margin-bottom: 4px; }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      #trash-zone { grid-area: panel; z-index: 5; pointer-events: none; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 15px; font-weight: 600; color: #fff; background: rgba(216, 50, 58, 0.82); border: 3px dashed #fff; }
      #trash-zone.blocked { background: rgba(60, 64, 74, 0.9); font-weight: 400; font-size: 13px; }
      #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #000c; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; }
      #toast.show { opacity: 1; }
      [hidden] { display: none !important; }
      /* While AR runs, nothing opaque may sit over the camera feed. */
      html.xr-presenting, html.xr-presenting body { background: transparent; color-scheme: normal; }
      #ar-overlay { color-scheme: normal; color: #fff; }
      #ar-overlay { position: fixed; inset: 0; pointer-events: none; }
      #ar-overlay button { pointer-events: auto; position: absolute; top: 16px; right: 16px; }
      #ar-status { position: absolute; left: 12px; right: 12px; bottom: 16px; padding: 6px 10px; border-radius: 8px; background: #000a; font-size: 13px; }
      @media (max-width: 720px) {
        body { grid-template-columns: 1fr; grid-template-rows: auto 1fr minmax(0, 38vh); grid-template-areas: 'bar' 'stage' 'panel'; }
        #panel { border-left: 0; border-top: 1px solid var(--line); }
        #toolbar h1 { display: none; }
      }
    </style>
  </head>
  <body>
    <header id="toolbar">
      <h1>ミニ四駆コースエディタ</h1>
      <button id="mode-2d" aria-pressed="true">2D</button>
      <button id="mode-3d" aria-pressed="false">3D</button>
      <span class="sep"></span>
      <button id="undo" title="元に戻す (Ctrl+Z)">元に戻す</button>
      <button id="redo" title="やり直し (Ctrl+Y)">やり直し</button>
      <span class="sep"></span>
      <button id="new">新規</button>
      <button id="copy-url">URLをコピー</button>
      <button id="export">書き出し</button>
      <button id="import">読み込み</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden />
    </header>
    <main id="stage">
      <canvas id="view2d"></canvas>
      <div id="view3d" hidden></div>
      <button id="fit">全体を表示</button>
      <div id="context" hidden>
        <button id="context-close" class="close" title="選択を解除 (Esc)" aria-label="閉じる">×</button>
        <section id="selection-panel" hidden>
          <div id="selection-name" class="title"></div>
          <div class="row">
            <label for="variant">色</label>
            <select id="variant"></select>
            <button id="flip" title="反転 (F)">反転</button>
            <button id="delete" title="削除 (Delete)">削除</button>
          </div>
          <div class="row">
            <button id="rot-left" title="左に15°回す (Q、Shift で 1°)">⟲15°</button>
            <button id="rot-right" title="右に15°回す (E、Shift で 1°)">⟳15°</button>
            <button id="raise" title="10mm 上げる">↑10mm</button>
            <button id="lower" title="10mm 下げる">↓10mm</button>
          </div>
          <div class="row">
            <label title="10mm / 15°刻みで動かす。Shift を押している間は解除"><input id="snap" type="checkbox" checked /> スナップ</label>
            <label title="つながっているピースを置いて、このピースだけ動かす"><input id="move-alone" type="checkbox" /> このピースだけ動かす</label>
          </div>
          <div id="group-info" class="hint"></div>
          <details>
            <summary>詳しく（配置の数値など）</summary>
            <div id="selection-note" class="hint"></div>
            <div id="placement-base" class="hint"></div>
            <div class="pose-grid">
              <label>前 <input id="pose-z" type="number" step="10" /> mm</label>
              <label>向き <input id="pose-yaw" type="number" step="15" /> °</label>
              <label>左 <input id="pose-x" type="number" step="10" /> mm</label>
              <label>上り <input id="pose-pitch" type="number" step="1" /> °</label>
              <label>上 <input id="pose-y" type="number" step="10" /> mm</label>
              <label>傾き <input id="pose-roll" type="number" step="1" /> °</label>
            </div>
            <p class="hint">ドラッグで移動（3D ではつかんだ高さの水平面上）。開いた口に近づけると吸着してつながります。つながっていないピースはパーツ一覧へドラッグすると片づけ（削除）できます。</p>
          </details>
        </section>
        <section id="joint-panel" hidden>
          <div id="joint-name" class="title"></div>
          <div class="row">
            <button id="split" title="分断 (Delete)">分断</button>
          </div>
          <p class="hint">分断すると、口は向き合ったまま切り離されます（赤い矢印）。ピースを動かすと、それぞれ別に動きます。</p>
        </section>
        <section id="port-panel" hidden>
          <div class="title">開いた口</div>
          <p class="hint">パーツ一覧のパーツをクリックすると、この口につなぎます。</p>
          <div id="join-row" class="row">
            <span id="join-name"></span>
            <button id="join">とつなぐ</button>
          </div>
        </section>
      </div>
      <details id="course-info">
        <summary id="course-summary">コース</summary>
        <div id="info"></div>
      </details>
    </main>
    <aside id="panel">
      <h2>パーツ</h2>
      <div id="palette"></div>
      <p id="palette-hint" class="hint"></p>
    </aside>
    <div id="trash-zone" hidden></div>
    <div id="toast"></div>
    <div id="ar-overlay" hidden>
      <button id="ar-exit">AR終了</button>
      <div id="ar-status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
