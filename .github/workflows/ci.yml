# Run the tests and the build on pull requests and on pushes to main (#20).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same as Cloudflare Pages builds with (#21).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
